backend:
  name: github
  repo: ongmataviva/website
  branch: main
  base_url: https://ongmataviva.pages.dev # Points to the root domain of this Cloudflare Pages deployment

local_backend: true # Automatically intercepts API calls when the local proxy runs

media_folder: "public/images" # Repo-relative path where uploaded media is stored
public_folder: "/images" # URL path used to reference media from the public/ root

collections:
  - name: "content"
    label: "Content Blocks"
    folder: "content" # Target directory (repo-relative) where files are created/edited
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
