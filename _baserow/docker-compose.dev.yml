# Baserow dev — minimal (5 containers: db + backend + frontend + caddy + redis)
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev123}

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: baserow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dev123}
      POSTGRES_DB: baserow
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: baserow/backend:2.3.3
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev123}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev123}
      BASEROW_PUBLIC_URL: http://localhost:8484
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: baserow
      DATABASE_NAME: baserow
      DATABASE_OPTIONS: >-
        {"sslmode":"disable"}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MIGRATE_ON_STARTUP: true
      # AI — OpenRouter endpoint (AI-ASSISTANT precisa disso em TODOS os services)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL: ${BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL:-qwen/qwen3.7-flash}
      BASEROW_ENTERPRISE_ASSISTANT_LLM_TEMPERATURE: ${BASEROW_ENTERPRISE_ASSISTANT_LLM_TEMPERATURE:-0.3}
      # AI — Generative fields/automations (AI-Field na UI)
      BASEROW_OPENAI_ENABLED_MODELS: ${BASEROW_OPENAI_ENABLED_MODELS:-qwen/qwen3.7-flash}

  web-frontend:
    image: baserow/web-frontend:2.3.3
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BASEROW_PUBLIC_URL: http://localhost:8484
      PRIVATE_BACKEND_URL: http://backend:8000
      # AI — OpenRouter endpoint (AI-ASSISTANT precisa disso em TODOS os services)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL: ${BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL:-qwen/qwen3.7-flash}
      BASEROW_OPENAI_ENABLED_MODELS: ${BASEROW_OPENAI_ENABLED_MODELS:-qwen/qwen3.7-flash}

  caddy:
    image: caddy:2.11.1-alpine
    restart: unless-stopped
    ports:
      - "8484:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
    depends_on:
      - backend
      - web-frontend

volumes:
  pgdata:
