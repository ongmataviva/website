name: Build content index

# Regenera data/index.json sempre que o conteúdo editorial muda (push em
# content/**). O índice é público e consumido pelo site em runtime — o site
# NÃO precisa ser rebuildado a cada notícia; ele busca o index.json via raw.
#
# O commit do bot só altera data/index.json, então não há loop de disparo
# (o filtro de paths é content/**).

on:
  push:
    paths:
      - 'content/**'
    branches: [content]

permissions:
  contents: write

concurrency:
  group: content-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install js-yaml
        run: npm install --no-save js-yaml

      - name: Generate data/index.json
        run: node scripts/build-content-index.mjs

      - name: Commit updated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update content index'
          file_pattern: data/index.json
